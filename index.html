<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCasal - Login</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="background-wrapper"></div>
    <div class="vignette-overlay"></div>
    <div class="grain-overlay"></div>

    <main class="login-container">
        <div class="glass-panel enter-anim">
            <div class="duo-emblem">
                <div class="duo-circle duo-1" data-icon="clapper"></div>
                <div class="duo-circle duo-2" data-icon="popcorn"></div>
            </div>

            <h1>Nosso Cinema</h1>
            <p>Acesse para ver nossa agenda.</p>

            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="email" placeholder="E-mail" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-glass">Entrar</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module" src="/src/js/supabase.js"></script>
    <script type="module" src="/src/js/auth.js"></script>
    <script type="module">
        import { hydrateIcons } from '/src/js/icons.js';
        hydrateIcons();
    </script>
</body>
</html>
